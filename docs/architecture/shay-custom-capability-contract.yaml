phase_test_execution_contract:
  local_evidence_rule: "Every executable command in the latest R1-R8 test_contract_relinked trace rows and the plan SHAY_PHASE_CONTRACTS_V2 block self-contains the literal absolute immutable-v4 SHAY_TEST_PYTHON and SHAY_TEST_ENV_PROVENANCE values. Commands that import or execute Shay also create and pin disposable external HOME, SHAY_HOME, and SHAY_PROMPT_MEMORY_VAULT roots under workspace_hygiene_contract.external_test_run_root with an empty environment. These absolute values are local evidence bindings, not committed portability defaults."
  applicable_set_rule: "For one phase, the applicable test set is exactly the executable commands plus non-executable acceptance assertions in its current test_contract_relinked tests array, byte-equal to the plan SHAY_PHASE_CONTRACTS_V2 entry, and the applicable R3/R4 or R5/R6 tool-issued compatibility receipt. Focused/full/E2E/integration/stress wording elsewhere classifies these commands but neither creates another top-level command nor permits omission. Only a current pre-implementation contract relink may change the set."
  pair_compatibility_receipt_rule: "For R3/R4 and R5/R6, run-phase-tests issues only an immutable awaiting_pair packet and no passing verification terminal. The designated coordinator then invokes the sole tool as run-pair-tests --pair-id SHAY-PAIR-R3-R4|SHAY-PAIR-R5-R6 with exactly one REQ=receipt_id input for each ordered member; caller input cannot select parent tips, trees, argv, environment, or assertions. The tool reopens both issued pending packets and accepted ledger dependencies, reconstructs the deterministic disjoint composed Git tree, and executes the frozen pair argv in a clean sandboxed checkout. The receipt closes exact member/dependency/composition identities, argv/effective argv/cwd, a scrubbed command environment whose HOME, SHAY_HOME, SHAY_PROMPT_MEMORY_VAULT, TMP/cache, and coverage paths are confined beneath one exact pair-output root and whose SHAY_TEST_PYTHON and SHAY_TEST_ENV_PROVENANCE equal the pinned immutable-v4 interpreter/provenance, sandbox profile-byte SHA with a failing network-denial probe, times, streams, source/environment before-after hashes, and pair-specific derived assertions. Before any prepared pathname exists, a hash-chained append-only transaction registry issues the self-addressed v3 transaction ID and embeds/binds its complete capped canonical prepared bytes. Recovery first reopens the two pending packets and accepted ledger, requires that issuance row, then revalidates pair authority and rederives both final packet IDs/manifests/terminal evidence; a caller-shaped pathname with no issuance is never authority. Every new final file uses a fully written and fsynced deterministic same-directory temporary followed by renameatx_np(RENAME_EXCL), directory fsync, and exact idempotent recovery; no temporary alias is unlinked. Registry replacement uses the common retained-prior CAS and never deletes displaced authority. Only after both member packets exist does the separate hash-chained pair-receipt registry publish eligibility. The pair gate is the sole issuer of each member's one passing verification terminal and pair_compatibility binding; the same immutable pair receipt bytes and SHA appear in both phase-evidence and candidate closures. R3/R4 exact argv is [scripts/run_tests.sh,--e2e,tests/integration/test_kanban_restart_recovery.py,tests/integration/test_typed_approval_clients.py]. R5/R6 exact argv is [scripts/run_tests.sh,--e2e,tests/integration/test_cross_client_contract.py,tests/integration/test_memory_provenance_profiles.py]. R8 reopens and recomputes both already-issued symmetric pair authorities and may not mint one. Wrong coordinator/order/member/base/tree/command/environment/result, overlap, unissued shaped transaction, asymmetric or mutated packet/evidence, partial publication, divergence, replay, or changed input fails closed."
  r7_availability_rule: "R7 tests only plugin command registration and direct shay doctor output within its exact manifest. The bundled operator plugin remains disabled by default and MUST be reported unavailable unless a separately authorized owner enable action is proven. R7 may not claim new plugin command coverage in classic global help, gateway_help_lines, autocomplete, or TUI commands.catalog. Because R7 inherits R3/R6 but not R4/R5, typed checkpoint/effect and memory-provenance fields are unavailable during R7; only R8's reviewed R5 integration may make those cross-capability fields eligible for final proof."
  portability_rule: "The committed scripts/run_tests.sh accepts caller-supplied absolute SHAY_TEST_PYTHON and SHAY_TEST_ENV_PROVENANCE, validates them without fallback or install, and never embeds this workstation's paths. CI creates and attests its own Python 3.11 all+dev environment below RUNNER_TEMP and supplies those two values."
  r5_benchmark_gate: "The R5 latest tests include a deterministic -k test_memory_provenance_benchmark_gate invocation, and R5 allowed_paths includes tests/fixtures/memory_provenance_benchmark_v1.json exactly. The gate implements phase_5_memory_benchmark_contract and is required, not optional."
  r1_node_baseline_gate: "The current cf6bb95 baseline is intentionally recorded as failing: public npm returns 404 for rename-damaged shay-parser/shay-estree lock URLs, and an integrity-matched local-cache reconstruction reaches tsc but fails on invalid launchShay-ShayCommand and resolveShay-ShayBin identifiers. R1 owns only the runtime repair: restore hermes-parser/hermes-estree package-lock keys, dependency names, URLs, and unchanged authoritative 0.25.1 integrity values; restore launchShayCommand/resolveShayBin identifiers; add ui-tui/src/__tests__/externalCli.test.ts; then run npm ci, the actual type-check script, and that focused test in an external disposable copy under pinned fnm 1.39.0, Node v24.19.0, and npm 11.17.0. Missing dependencies, cache-only reconstruction, or the current typecheck failure are not a PASS."
  r6_node_gate: "R6 inherits the externally complete reviewed R1 repair and may not rewrite it. Its latest tests include a hermetic external-copy proof using the actual ui-tui package.json scripts: npm run type-check and npm test -- src/__tests__/gatewayClient.test.ts. The command rejects any remaining shay-parser/shay-estree lock key, verifies authoritative hermes-parser/hermes-estree 0.25.1 entries, uses an external HOME/cache/index/copy with pinned fnm 1.39.0, Node v24.19.0, npm 11.17.0 and lockfileVersion 3, and may not touch repository ui-tui/node_modules or ignored state. Branch CI provisions the same versions and runs the same typecheck/focused gateway test against its checkout with RUNNER_TEMP roots."

branch_ci_gate_map:
  workflow_owner_r1: "R1 owns the stable branch selector plus required test and e2e jobs and may not weaken main or pull-request triggers."
  workflow_owner_r8: "R8 may only add its exact acceptance mapping and required shay-upgrade-proof job; it preserves the reviewed R1-R7 selector and jobs."
