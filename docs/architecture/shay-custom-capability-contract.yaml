8 immutable tool-issued scrubbed exact-command manifest/receipts, identified only through the protected receipt registry and consumed once for the exact candidate tree; a caller path or PASS string is insufficient. release_policy is exact CI-not-applicable-bootstrap for R0 and required workflow path/jobs for R1-R8. r8_proof is null until R8 and then binds the exact candidate proof blob. The current R0 instance has empty dependency_commits and both bases at cf6bb95e3dc12e0d4b8eadef2c33be2b39ad21b6. candidate_index is exact {path,sha256,mode,uid,gid,nlink,device,inode,size,mtime_ns,flags}, with mode=0400 and flags containing macOS UF_IMMUTABLE; every field is rechecked before and after disposable-copy Git use. All remaining fields retain strict closed bindings. Extra/missing keys, duplicate keys, noncanonical bytes, caller-only claims, ancestry/tree mismatch, unsafe paths, or drift fails closed."
  review_result_schema: "The independent review artifact is canonical JSON plus newline with exact {schema_version,requirement_id,candidate_tree_sha,candidate_binding_sha256,pointer_verification,review_result,disposable_removed}. schema_version=5; pointer_verification is exact {sha256,proof}, where proof is exact {schema_version,requirement_id,candidate_tree_sha,candidate_binding_sha256,review_procedure_sha256,verifier_sha256,selection_state_sha256,candidate_state_sha256,started_at,ended_at,duration_ms}; sha256 is recomputed from canonical proof bytes, all identities project exactly to the selected candidate, and the RFC3339 interval agrees with duration_ms. review_result is exact {review_type,status,reviewer,findings,verifier_sha256,review_procedure_sha256,dispatch_ref}; dispatch_ref is exact {orchestrator_task_id,assurance:procedural_not_cryptographic}. review_type is verification, anti_pattern, or quality; status is only passed or failed; reviewer and task ID are non-empty stable strings; findings is an array of exact {severity,code,message,path,line}, severity is only low, medium, high, or blocker, path is repository-relative or null, and line is a positive integer or null. A pass has no medium/high/blocker finding and a failure has at least one finding. The immutable ledger review_result adds exact result_artifact, pointer_verification, and recorder fields while retaining dispatch_ref byte-for-byte. The recorder validates the artifact bytes, its embedded selected pointer/candidate/binding/procedure/tool identities, recomputes the proof digest, and under the same exclusive lock reruns pointer verification and compares the proof's stable identity projection before append. Review events have all unrelated refs null. All three current passing results have distinct review types, reviewer identities, and orchestrator task IDs and bind byte-identical candidate state. These are procedural policy checks, not cryptographic proof of cognition or independence. Reviewers use only private disposable candidate-index copies; `candidate_index.path` is never provided to Git."
  ledger_prefix_anchor_schema: "Candidate-local execution-ledger-prefix.jsonl is an immutable exact prefix captured under the shared execution-events.lock during candidate construction. execution-ledger-prefix-anchor.json is canonical JSON plus newline with exact {schema_version,format,ledger_path,prefix_path,prefix_line_count,prefix_sha256,prefix_last_event_id,prefix_last_sequence,prefix_last_line_sha256,mode,uid,gid,nlink}; format=shay-execution-ledger-prefix-anchor-v1. The prefix begins with the exact validated v3 genesis and ends only on a complete canonical line. Routine review requires current ledger bytes to start byte-for-byte with this snapshot and validates every later line's closed schema, sequence, prior event, prior-line SHA, transition, and idempotency under the shared lock. A compliant append does not invalidate the candidate. Prefix mutation, deletion, reordering, insertion, rewrite, malformed suffix, or chain discontinuity fails closed."
  review_recording_rule: "Reviewers never append the ledger. A distinct recorder invokes record-reviews with one to three immutable typed results; every ledger review projection records that distinct recorder identity. This permits immediate durable recording of a failed result and deterministic partial-batch resume. Under one exclusive lock it reruns pointer verification, validates the candidate-bound prefix and full suffix, loads every exact standalone result byte/hash/schema/projection, compares a fresh verifier-produced pointer proof, and appends missing review/supersession rows in verification/anti_pattern/quality order. A repeated identical result is a no-op; a new result of the same type first emits review_set_superseded; a different active pointer/candidate first emits candidate_superseded and invalidates all old passes. After failed CI, candidate_superseded requires reason failed_ci_successor and the exact failed-CI event/old branch/tip; the successor has a new attempt ID and feature branch. Divergent idempotency/event reuse fails. Three current passes from distinct reviewer identity strings and one distinct recorder remain mandatory, but local tooling cannot cryptographically prove reviewer cognition or agent-task independence: the orchestrator must dispatch three separate reviewer tasks and retain their task IDs/provenance when available; the local gate proves only distinct strings, artifacts, and candidate binding. Candidate closure revalidates its captured immutable pre-review board/ledger leaves, never the later mutable board as procedure input. The commit agent stages exactly the reviewed paths before prepare-commit. Under the same locks, prepare-commit separately validates the current ledger as the captured prefix plus only the required supersession and exact ordered three PASS rows, and the board as the captured projection plus only the sole recorder's exact phase_gate=review public add_comment comment/event, with no task/link/run/status/schema drift. It then binds the selected closure/results/tool, attempt branch, staged tree/diff/path/blob/mode rows, real index and protected invariants and issues one content-addressed immutable authorization. That authorization fixes raw commit bytes plus exact /usr/bin/git commit-tree argv/stdin/cwd/minimal identity-date environment and a compare-and-swap update-ref from the reviewed parent to expected C with repo-local hooks disabled by `-c core.hooksPath=/dev/null`. record-commit requires the same authorization, revalidates pointer/full closure/results/tool, current review transition and exact C bytes/tree/parent/message/author/committer/branch/index, records it, and consumes it after ledger fsync. Object-before-ref, commit-before-ledger, and ledger-before-consumption retries complete idempotently; ref races, hooks/signing/config drift, stale receipts, and divergent reuse fail. Every later recorder repeats full archived candidate/index/attempt/accepted-C closure. record-push-bootstrap is R0-only; record-push-ci is R1-R8-only; record-reconciliation is R2-only and executes the exact accepted-C reconciler; record-kanban owns the sole exact accepted-C domain task mutation/readback; record-finalize is R8-only."
  precommit_integration_rule: "R0 candidate selection additionally requires one preissued receipt from the separate top-level prepare-commit-integration command. Stage 1 runs the complete current-tool named suite and documentation validator. Under a dedicated no-follow lock, an append-only registry records the exact content-addressed prepared transaction before Stage 2 and the issued row later references that preparation and immutable receipt; a filesystem-only receipt is never authority and retry reuses the sole preparation. Stage 2 uses a fresh marker-owned external root and dependency-injects only its disposable real Git clone and selection, ledger, board, review-result, transaction, and staging authority paths; it invokes the unchanged production build, pointer verifier, three typed PASS reviews with distinct identities and dispatch IDs, record-reviews, public board add_comment, exact four-path git staging, prepare-commit, and receipt/registry reopen. The integration candidate cannot bind its own receipt; only the subsequent real candidate copies and binds the issued content-addressed receipt alongside the exact Stage 1 results. All authoritative board DB/JSON validation reads use held no-follow descriptors to publish mode-0400 byte copies inside the disposable root; SQLite opens only the copied DB with immutable and query_only enabled, and any authoritative -wal or -shm sidecar blocks before projection. The disposable candidate index is the only integration-created immutable file: cleanup may clear its flag only through its in-process recorded device/inode/hash/mode/owner/link identity before descriptor-safe removal."
  dispatch_identifier_rule: "orchestrator_task_id is at most 255 characters and uses one closed grammar at review issuance, result replay, recorder validation, and ledger replay: an optional leading slash followed by one or more slash-separated nonempty segments whose characters are ASCII letters, digits, underscore, dot, colon, at-sign, or hyphen, optionally followed by one hash-sign suffix made from the same segment grammar. Thus both /root/r0-review and the actually issued encoded form root-r0-final-verification-round10 are valid, while whitespace, empty segments, path traversal, and a lone slash are rejected. A dispatch identifier is globally unique across all historical review rows and partial batches; reuse is rejected even after supersession. This is procedural provenance, not cryptographic proof of cognition."
  non_review_event_schema: "candidate_superseded and review_set_superseded use only candidate_binding plus their exact closed supersession ref in review_result. execution_ledger_initialized remains the all-null genesis. implementation_commit_recorded has exact {sha,branch,tree_sha,kind,staging_receipt}. R0 feature_branch_bootstrap_verified and R1-R8 feature_branch_push_verified or ci_verification_failed use exact remote_ref {remote,branch,sha,verified_at,ci,provider_observation}. Provider observations directly bind canonical raw query/response bytes and their content hash; normalized facts are independently derived. reconciliation_ref and kanban_ref remain closed accepted-C projections. Each program_finalization_query_issued is the sole authority for one numbered generation: it has null requirement_id, outcome=issued, the exact accepted R8 candidate_binding, and only r8_snapshot_ref containing closed schema version 4, candidate/tree/binding/tool, cryptographic nonce, issued_at, completed pre-final ledger prefix/count/tip/time, exact nine provider targets and generation-unique derived query IDs, fixed 30-second absolute wall-clock deadline per query, 8 MiB per-response/64 MiB per-attempt aggregate caps, max_attempts=16, candidate-global generation, and the exact preceding generation exhaustion. Immediately before every Popen or urlopen, program_finalization_query_started durably reserves that issued query identity, canonical argv/cwd/scrubbed-environment/no-shell descriptor or exact HTTPS request descriptor, attempt/call sequence, and its maximum observable-byte charge. The first reservation starts and charges the attempt. Exactly one program_finalization_query_result then binds the exact immutable start row plus completed, failed, or interrupted bytes/outcome; a completed result replaces the reservation with actual observed bytes, while a crash with no result is recovered as interrupted and conservatively retains the full reservation charge. A result with no later attempt closure is deterministically closed before any new provider work, so neither crash window can replay a call or reuse an attempt sequence. No provider call precedes its issue and started rows. A failed-attempt row retains only its exact failed-query evidence, never duplicates a successful raw prefix; stdout+stderr+diagnostic retained bytes are jointly capped at 64 KiB. The parser recomputes one non-resettable candidate-wide maximum of three generations, 48 attempts, and 64 MiB of all observed or conservatively reserved provider bytes across stdout, stderr, and HTTP bodies, including a cap-trigger byte; successful results preserve exact wire bytes so replay recomputes observed counts separately from retained counts. The boundary requires program_finalization_retry_budget_exhausted with outcome=blocked_needs_owner_action; it references and closes the exact active issuance/current attempt or last generation exhaustion, grants nothing, and makes every later automatic invocation perform zero provider calls. No automatic retry authorization exists. program_finalized or program_finalization_abandoned may follow only an active non-exhausted, in-budget issue. Finalized embeds all nine capped raw responses and normalized facts. Abandoned is allowed only for irrecoverable issued-plan or semantic-integrity failure and embeds recomputable failure bytes. No filesystem receipt, forensic store, object namespace, seal, closure registry, cleanup, or deletion authority exists for terminal provider data."
  event_ref_nullability: "Review and supersession events have only candidate_binding and review_result non-null. implementation_commit_recorded has only commit_ref non-null; feature_branch_bootstrap_verified, feature_branch_push_verified, and ci_verification_failed only remote_ref; kanban_completed only kanban_ref; reconciliation_recorded only reconciliation_ref. program_finalization_query_issued has candidate_binding plus r8_snapshot_ref; program_finalization_query_started, program_finalization_query_result, program_finalization_query_attempt_failed, program_finalization_retry_exhausted, program_finalization_retry_budget_exhausted, program_finalization_abandoned, and program_finalized have only r8_snapshot_ref. execution_ledger_initialized has all event-specific refs null. The two base SHA fields follow common_schema and are not event-specific refs. Any other nullability pattern fails."
  transition_rule: "After execution_ledger_initialized, each requirement records review attempts for exactly one current active candidate. Failed results are durable and block commit until explicitly review-set-superseded; a successor candidate explicitly candidate-supersedes all old passes. implementation_commit_recorded requires the pointer-selected candidate and latest non-superseded verification/anti_pattern/quality passes from distinct reviewers. R0 then requires feature_branch_bootstrap_verified remote equality with CI-not-applicable-bootstrap. R1-R8 require provider-backed feature_branch_push_verified success or ci_verification_failed. The successful remote gate precedes record-kanban; R2 also requires passing record-reconciliation. After all R0-R8 completions, generation 1 program_finalization_query_issued may append. Each actual provider call requires one ordered program_finalization_query_started reservation before I/O and one matching program_finalization_query_result afterward; the first start charges its attempt. An interrupted start remains fully charged, and a result without an attempt closure is failed before retry. Zero through fifteen closed transient attempts may be followed by success or irrecoverable abandonment. The sixteenth transient failure is immediately followed by program_finalization_retry_exhausted unless the candidate-wide attempt or observed/reserved-byte budget is reached, in which case program_finalization_retry_budget_exhausted directly closes the active issuance. Automatic issuance is candidate-wide finite and non-resettable: at most three generations, 48 started attempts, and 64 MiB observed or conservatively reserved provider bytes. The exact boundary requires program_finalization_retry_budget_exhausted and blocks every further query call with blocked_needs_owner_action. There is no same-UID authorization or automatic reset path. Success appends program_finalized only from an active in-budget generation. Only an irrecoverable issued-plan or semantic-integrity violation may append program_finalization_abandoned. Neither terminal accepts later events; retryable failures and exhausted budgets never claim completion. A terminal or budget-exhausted no-op creates no new issue and performs no provider call."
  append_protocol: "Only an authorized recorder/operator opens the already-existing lock_path with O_RDWR|O_NOFOLLOW and holds an exclusive fcntl.flock(LOCK_EX) across read, strict prefix/full-chain validation, idempotency check, logical append, and durability steps. It opens ledger_path O_RDONLY|O_NOFOLLOW; for both paths, lstat/fstat before and after locking/opening prove the same regular-file device/inode, st_uid=os.geteuid(), permission bits exactly 0600, and st_nlink=1. Immediately before each logical append it revalidates the candidate-bound prefix and entire current lifecycle state, publishes exact old bytes plus one complete canonical UTF-8 JSON-plus-newline row in the deterministic content-addressed replacement slot, fsyncs it, rechecks the live prefix/inode, and uses macOS RENAME_SWAP to install it. The displaced exact prior ledger inode is validated and sealed mode 0400 in that .shay-retained-authority slot, both directories are fsynced, and it is never unlinked. Retry accepts only the exact installed/replacement plus retained/prior tuple. A concurrent target is atomically swapped back without deletion or content/mode/ownership/link-count/size/mtime mutation. A stale prefix, partial old line, unexpected temporary, divergent retained tuple, or divergent row fails. This preserves byte-prefix append-only history while preventing torn physical lines. Reviewers never receive this write path; no unlocked multi-writer mutation, history reordering, sorting, repair, or destructive displaced-authority cleanup is permitted."
  output_path_rule: "Every run root, findings/result/token/provider-receipt input, and review/recorder/receipt output is an absolute normalized external path disjoint in both containment directions from the repository, candidate/shared v3 state, immutable v4 environment, live ~/.shay, protected Obsidian Shay-Memory, and the complete durable ~/.local/share/shay-agent-transactions authority tree. Symlink or realpath overlap fails. An input must already be a regular effective-user-owned mode-0400 nlink-1 file; an output must not exist and its nearest existing parent must be an owned directory outside those roots. A run root must begin as one empty mode-0700 owned directory; before any child is created the tool issues a closed marker binding exact path/inode/owner/tool. Cleanup validates that marker and preflights the entire disposable tree for containment, ownership, hardlinks, special files, and immutable flags before deleting one entry. It never chmods a path or follows a cleanup symlink and requires Python's descriptor-relative symlink-attack-resistant rmtree implementation; a platform without that implementation fails closed. An unmarked nonempty path, partial immutable seal, pre-existing output leaf, or path/descriptor inode drift fails closed without partial cleanup. Provider receipts must survive outside disposable run roots."
  node_audit_status: "The R1 and R6 Node setup commands intentionally use npm ci --no-audit. Installation, type-check, and focused test success do not assess dependency vulnerabilities and MUST NOT be described as a security clearance; Node vulnerability/audit status remains unassessed until a separately authorized audited result is recorded."
  candidate_index_immutability_rule: "candidate-index is an authoritative mode-0400 external archive sealed with macOS UF_IMMUTABLE. No Git command ever receives its path. Verification, dry review, prepare-commit, record-commit, and terminal recorders first bind byte hash plus mode/uid/gid/nlink/device/inode/size/mtime_ns/flags, copy bytes to a fresh mode-0600 disposable index, set GIT_OPTIONAL_LOCKS=0, use only that copy, delete it, and prove every authoritative byte and metadata field unchanged. The Round 14 audit identifies the exact former writer: an independent verification command passed the authoritative index to git write-tree without GIT_OPTIONAL_LOCKS=0, so Git's lockfile rename changed inode and mode to 0644 while preserving the content hash. That historical candidate is preserved and invalidated; it is never chmod-repaired. Concurrent three-review stress is a mandatory counterexample against recurrence."
  selection_gate_rule: "build-select, build-phase-select, resume-select, and resume-phase-select hold both the exclusive ledger and candidate-selection locks and verify eligibility before changing selection authority. R0 first issues a content-addressed immutable mode-0400 prepared document through its mode-0600 append-only issuance registry, before creating any candidate staging directory. That closed document restricts the candidate tree/destination/staging path, attempt, complete predecessor history, selection base, build-input digest, and tool. resume-select accepts only a candidate tree named by an exact immutable issued v2 preparation, plus its issued seal when one exists; an arbitrary shaped directory or legacy pre-journal orphan fails before any artifact read, rewrite, cleanup, invalidation, registry, or pointer action. R0 has no legacy resume authority. Only after complete construction does the tool issue an immutable seal binding the artifact/index inventory, selection row, and exact active-predecessor invalidation plus registry/pointer replacement bytes. Its temporary_path fields are reserved compatibility values only: current code never creates, selects, rewrites, or deletes them, and any populated pathname blocks. Registry/pointer replacement uses the retained-prior CAS; retry requires exact installed/replacement plus mode-0400 retained/prior bytes. It then atomically publishes the stage and finally issues an immutable selected record. Recovery first compares the complete discovered preparation set with the independently immutable prepared rows already present in the issuance registry. Any unissued or missing document fails before cleanup, abandonment, registry append, or selection mutation; discovery can never retroactively issue authority. For issued transactions only, recovery detects exact already-applied publication/invalidation/registry/pointer/selected steps, completes only missing operations in order, fsyncs files/directories, rejects divergence or out-of-containment targets, and never deletes displaced authority or an unproven path. An unsealed or sealed old-tool preparation may be immutably abandoned only while its original main registry/pointer remain exact and it has published no candidate or invalidation; the issuance registry preserves the preparation/seal/abandonment and its exact journal-owned staging tree, when present, remains inert failed-build evidence that can never be published or selected. The one previously completed post-CAS cross-tool selected record is accepted only as immutable history: its stored hash chain, candidate, original producer archive, reconstruction provenance, and recorded recovery-authorizer identity are reopened exactly, but a later tool never reinterprets or reruns that authorizer proof and cannot use it for fresh selection or commit authority. A fresh R0 successor is authorized solely by its own current-tool Stage 1 and issued Stage 2 integration receipt and invalidates the historical active candidate exactly once through the normal locked transition. R1-R8 persist their prepared journal before staging/pending publication or receipt consumption; its pending_published, candidate_published, receipt_consumed, and selected states reconcile actual staging/pending/candidate/receipt/invalidation/registry/pointer state and make every before/after fsync, rename, and append interruption resumable/idempotent without losing or double-consuming a receipt. Generic cleanup preserves any candidate-staging path named by a valid prepared journal. Selection may advance only before implementation_commit_recorded, after a recorded failed review, or after an authoritative ci_verification_failed event authorizes a distinct successor attempt/branch, and rejects after an accepted commit without failed CI, kanban_completed, or program_finalized."
  r0_unsealed_recovery_rule: "An R0 preparation or preselection seal remains immutable failed-build evidence. If it binds an older tool SHA, the current tool appends a content-addressed mode-0400 abandoned or sealed_abandoned record and append-only registry row that bind the original prepared bytes/tool, the seal when present, and the current closing tool. If staging never began, the record truthfully binds preserved_absent with a null root and empty entries while holding and revalidating the transaction-owned staging parent. If the exact journal-owned staging tree exists, recovery holds its no-follow directory descriptor across the append and binds/revalidates the root plus every readable top-level regular file by bytes and full inode metadata. A mode-0400 .shay-retained-authority directory is deliberately opaque: the record binds only that directory inode/metadata and its sorted child-name namespace, labels descendant bytes uninspectable without execute permission, and never chmods, traverses, deletes, repairs, publishes, or selects it. Sealed abandonment additionally requires the main registry/pointer to equal the prepared selection base, the candidate destination to remain absent, and no predecessor invalidation to exist. Any published, partially mutated, unissued, or divergent path can never use this preservation path."
  issued_test_receipt_rule: "run-phase-tests is the sole issuer. It materializes the exact tested Git tree into a fresh external no-hardlink checkout and proves its tree/source inventory and clean before/after state; mutable worktree bytes are never test authority. The macOS sandbox denies writes to immutable source/configuration and all repository/live/v3/v4/Obsidian/shared-input paths throughout command execution, so transient write-and-restore cannot evade the gate; Python receives only a fresh external output/temp root, while Node additionally receives only declared isolated generated dependency/build directories. It stores immutable manifest/JSONL, tool-issued terminal phase evidence, and any R8 proof in a tool-owned per-phase receipt directory, then appends a hash-chained issued row to the mode-0600 receipt registry. build-phase-select accepts only --receipt-id, discovers bytes through that registry, verifies tool/phase/tree/argv/env/timing/streams/artifacts and immutable-v4 before/after hashes, and consumes the receipt exactly once for the selected tree. Caller JSON paths, passing strings, forged timestamps/env/output, or reuse fail. Every local execution step runs through macOS sandbox-exec; non-acquisition steps also require a successful deny-network probe. A composite Node workflow is split so only the exact npm ci --ignore-scripts --no-audit --no-fund dependency-acquisition step uses honestly labeled unrestricted network; type-check, test, build, and all remaining steps stay network-denied. Its vulnerability audit status remains unassessed. If the platform denial or source-write-denial mechanism is unavailable, local testing blocks. Run roots are rejected before creation or cleanup if either-direction containment, symlink ancestry, or protected/shared/repository/live/v4 overlap is present."
  phase_evidence_order_rule: "A future phase file is closed and contiguous: exactly one implementation_started row; one or more implementation_evidence rows; then exactly one verification or blocked row. Every field and relationship is exact: phase/requirement, revision/prior ID, strictly increasing timestamp, attempt branch, candidate/tested tree, bases/dependencies, frozen authority fields, changed-path state, honest external nulls, and unique structured Git/external/test receipt/artifact refs whose registry IDs and bytes are recomputed. Each implementation_evidence row cites concrete changed Git blobs with fixed assertions/observations; the union covers the allowed changed paths exactly once. Only run-phase-tests may issue the passing terminal row after nonempty exact command receipts exist; its test_results and verification_refs exactly project the issued registry receipt, generated artifacts, tested tree, attempt, branch, base, and dependencies. For R8 the proof binds the preterminal test receipt while the issued terminal row is separately byte-bound and appended unchanged, avoiding a pre/post phase-blob mismatch. A blocked terminal has its closed failed-receipt shape and cannot back selection. Gaps, reordering, arbitrary middle/final fields, forged refs, or passing strings fail."
  r8_proof_issuance_rule: "The R8 runner rejects a preauthored proof blob, uses a separate clean verification checkout, rewrites SHAY_UPGRADE_PROOF_OUTPUT to a fresh durable location, executes the command, and ingests the new canonical bytes before cleanup. Candidate-controlled marker strings, assertion booleans, totals, test literals, and shaped receipt strings are reporter data only and have no acceptance authority. The bound tool derives the six exact ordered markers from six closed, kind-specific semantic projections: exact tested Git tree/base/manifests; complete R1-R7 ledger state; content-hashed ignored/live/v4 invariants plus enabled-functional-to-disabled-legacy-functional rollback receipt; exact reviewed R5 candidate/C/completion/test-execution/phase-evidence bytes; the complete tool-issued command receipt set; and the exact sandboxed CLI E2E command, exit, stdout, and source blob digests. It recomputes these relationships from immutable Git objects, the candidate-bound ledger prefix, and tool-issued receipts, then derives assertions and totals itself. Totals are exactly two executed/passing contracted top-level commands and six validated semantic evidence kinds. The behavioral rollback remains a tool-issued internal sub-step of the applicable proof command and may not be promoted into a third contracted command receipt. Missing, duplicated, reordered, caller-shaped, false, or digest-mismatched observations fail, with negative behavioral counterexamples for each class. The internal rollback receipt uses an isolated Shay home, enables the bundled operator plugin, proves the new path functions, executes the public flag-off operation, proves the legacy path functions again, and verifies protected state. rollback_results binds that real behavioral sequence. Candidate artifacts/protected hashes, disabled-default policy, v4 provenance, and the pre-review ledger/board snapshot are independently recomputed. The builder may add only the receipt-generated proof path plus receipt-bound terminal phase evidence after the tested source tree."
  verifier_suite_rule: "The bound tool has exactly one callable self_tests suite. Its schema-v25 result contains one sorted current-property inventory of directly executed behavioral acceptances/counterexamples, including immutable snapshot versus authorized review delta, exact staged-state failures, deterministic raw commit-tree/CAS behavior, and staging registry crash/retry cases; source-literal, token-presence, and tautological structural checks have no acceptance authority. The separate schema-v4 78-label legacy inventory is a retired non-authoritative historical inventory and makes no equivalence or acceptance claim. Candidate closure stores verifier-self-test.json plus that exact legacy-test-case-map.json leaf. Current capture fails on any active behavioral property failure, duplicate label, missing inventory item, or byte drift."
  idempotency_rule: "Review keys include program, requirement, event/review type, candidate tree, and exact standalone result SHA; commit/push/finalize keys use the current candidate tree; supersession keys include exact old/new candidate or old-event/new-result identities. Repeating a semantically byte-identical key is a no-op, including partial review-batch resume; divergent reuse fails. Review retries and candidate/failed-CI successors always retain old immutable history and emit explicit supersession before new evidence."
  initialization_rule: "Historical/idempotent validation only: the v3 ledger begins with its exact sequence-1 execution_ledger_initialized genesis, the named board has the nine exact tasks/links, immutable v4 is finalized, and repository E0009/E0010/E0011 are complete. The genesis is an immutable prefix anchor, not a requirement that the whole ledger retain its original one-line SHA forever. Neither retired genesis was copied into v3. A rerun acquires shared/read-only access and validates the bound prefix plus every append-only suffix line; it never reinitializes, repairs, bootstraps, or appends. Later review writes are performed only by the separate recorder command after standalone artifacts validate."
  r2_reconciliation_rule: "R2's reconciler reads ledger_path with a shared lock and reads the exact board database, canonical repository trace, and phase_local_evidence_contract.path_map. The bound tool independently verifies hash-chain/schema/transitions, exact board IDs/links/status, exact created/completed/promoted/commented events, task runs, pre-review event chains, candidate/review/commit/push/completion order, remote-equality evidence, dependency-tip resolution, and R8 cutoff claims. Only two comment bodies are legal for a bound phase attempt: `phase_gate=start requirement_id=<phase> attempt_id=<bound-attempt>` and `phase_gate=review candidate_tree_sha=<bound-tree> diff_sha256=<bound-diff>`, each paired to exactly one public add_comment record/event. Arbitrary known-task events, extra runs, forged trace branches, and mismatched hashes/refs fail. It never writes Git, the ledger, or the board. Only the bound record-reconciliation verb may validate the immutable closed report against current candidate/C/evidence/ledger/board anchors and append reconciliation_recorded under the exclusive lock."

