structured_schemas:
  contract_revision: "Required on every row after frozen_40_row_prefix and exactly non-synced-v3. The exact frozen prefixes alone retain their historical field shapes; no field-level or semantic approximation is accepted."
  setup_attempt_id: "Required on every row after frozen_40_row_prefix and exactly local-state-v3. Retired attempts may be named only in historical evidence. No other mapping is valid."
  timing_status: "Required on every row after frozen_40_row_prefix. Allowed values are captured, not_applicable, and unknown. unknown is allowed only on SHAY-AGENT-R0:E0009 verification_invalidated to describe the historical E0008 records whose real intervals were never captured; it can never support a PASS. captured is required for any executed test result or active verification and requires a real started_at < ended_at interval recorded around execution. not_applicable is allowed only for a row that runs no command and has test_results.status not_run or blocked-before-execution."
  implementation_approval: "Exact object {status, approved_on, source_type, source, scope}; status=approved for this program, approved_on is YYYY-MM-DD, source_type=user_message, and all text values are non-empty."
  merge_approval: "Always null in this in-repository implementation trace. A later owner merge decision is a separate PR/owner-handoff fact and never changes the reviewed program bytes."
  research_source: "Exact object {source_ids, artifact, observation, interpretation}; source_ids is a duplicate-free array of declared external source IDs, artifact is an absolute path or null, and observation/interpretation are non-empty strings."
  recommendation_ref: "Exact object {status, source_ids, recommendation_id}; status=recorded, source_ids is duplicate-free, and recommendation_id is a non-empty stable ID."
  plan_ref: "Exact object {status, path, section}; status=recorded, path is a normalized repository-relative path, and section is non-empty."
  kanban_ref: "Exact object {status, program_id, root, board, database, task_id, idempotency_key, task_status}; status is not_created, linked, superseded, in_progress, blocked, done, or archived. The first 29 lines validate only by archived_attempt_prefix. The required v3 setup_blocked row uses archived_v2 root/database/key/task exactly; active program_board_relinked and all later events use program_board_contract v3 root/database and exact_idempotency_keys. task_id is null only when status/task_status are not_created, otherwise it is a non-empty actual Kanban task ID; task_status is not_created or an actual Kanban status triage, todo, ready, running, done, blocked, or archived. program_board_relinked uses status=linked and a new actual v3 task ID; it supersedes history by chain order without changing either retired task set."
  dependency_refs: "Exact object {primary, integrated, review_gates}; primary and every integrated item are exact {requirement_id, status, reviewed_commit}, with status not_applicable or pending_reviewed_commit allowing null reviewed_commit and status reviewed requiring the externally proven dependency C SHA; review_gates items are exact {requirement_id,status,review_ref}, with pending_review allowing null review_ref and reviewed requiring the external quality_review event ID that completed three current passing bindings. integrated and review_gates are duplicate-free by requirement_id."
  changed_paths: "Exact object {status, paths}; status is not_started, clean, changed, or verified; paths is a sorted duplicate-free array of normalized repository-relative paths and must be empty for not_started/clean. External program-board files never appear here."
  test_results: "Closed variant by evidence stream: canonical contract-trace rows use exact {status,results}, while the final R1-R8 phase-local pre-review verification row uses the exact receipt projection defined by terminal_receipt_projection_rule. In the canonical variant status is not_run, passed, failed, or blocked; results contains exact objects {command,exit_code,status,started_at,ended_at,passed,failed,skipped,artifact_sha256}. For not_run results is empty. A blocked-before-execution result may use null exit/counts and may omit an interval only when the enclosing timing_status is not_applicable. Any executed result requires non-empty RFC3339 timestamps with started_at < ended_at captured immediately around that command, non-negative exit/counts, and an artifact SHA-256 or null. Aggregate passed requires timing_status=captured and every result passed with exit_code 0. The E0009 correction may describe E0008 with timing_status=unknown but cannot restate its results as passing."
  review_results: "In repository events this is always the exact object {status:not_reviewed, results:[]}; authoritative reviews use external_execution_ledger_contract.review_result_schema."
  verification_refs: "Closed variant by evidence stream: canonical contract-trace rows use exact {status,events}; the final R1-R8 phase-local pre-review verification row uses the exact runner/artifact projection defined by terminal_receipt_projection_rule. In the canonical variant status is not_run, passed, failed, or blocked; events is a duplicate-free array of event IDs and is empty only for not_run."
  review_refs: "In repository events this is always the exact object {status:not_requested, verification:null, anti_pattern:null, quality:null}; authoritative review event IDs are external."
  commit_ref: "Always null in repository events; authoritative implementation-commit facts use external_execution_ledger_contract."
  release_ref: "Always the exact object {status:not_requested, feature_branch_push:null, pull_request:null, merge:null, live_enablement:null} in repository events; authoritative push/completion/finalization facts use external_execution_ledger_contract and merge/live approval remains separately owner-gated."
  evidence_item: "Each evidence array item is an exact object {kind, status, path, sha256, assertion, observation}; kind is absence, source, test, artifact, review, board, or release; status is absent, observed, passed, failed, blocked, or verified; path is an absolute path, normalized repository-relative path, or null; sha256 is a SHA-256 or null; assertion and observation are non-empty strings. A proposal uses an absence item and never a future-feature PASS assertion."
  finalization_ref: "Always null in repository events; program_finalized is external-only."

