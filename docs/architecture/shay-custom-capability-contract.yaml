    - "docs/architecture/evidence/shay-agent-r1-events.jsonl"
    - "ui-tui/package-lock.json"
    - "ui-tui/src/__tests__/externalCli.test.ts"
    - "ui-tui/src/app/slash/commands/setup.ts"
    - "ui-tui/src/lib/externalCli.ts"
  forbidden_paths:
    - "Every repository path not listed in allowed_paths"
    - "PERSONA.md"
    - "SOUL.md"
    - "docker/SOUL.md"
    - "shay_cli/voice.py"
    - "tools/voice_mode.py"
    - "tools/tts_tool.py"
    - "tools/neutts_synth.py"
    - "scripts/discord-voice-doctor.py"
    - "website/docs/guides/use-voice-mode-with-shay.md"
    - "website/docs/user-guide/features/voice-mode.md"
    - "website/docs/user-guide/features/tts.md"
    - "/Users/famtastic-fritz/.shay/**"
    - "/Users/famtastic-fritz/.shay/.env"
    - "Any credential, token, account, message, publish, payment, filming, or production path"
  test_state_rule: "All tests use two distinct external phase/profile roots. Before imports, each process clears inherited HOME, SHAY_HOME, SHAY_PROMPT_MEMORY_VAULT and every Kanban override, then pins disposable HOME, SHAY_HOME, and prompt-memory vault descendants of only that profile root. Tests prove no real-HOME or live-vault read/write and no cross-profile memory, vault, Kanban, cache, log, database, or artifact spillover. Owner-profile before/after path/hash/mtime sentinel manifests and repository ignored-state manifests must remain byte-identical."
  e2e_mode_contract: "Phase 1 adds scripts/run_tests.sh --e2e [additional pytest paths or flags]. That mode requires caller-supplied absolute SHAY_TEST_PYTHON and SHAY_TEST_ENV_PROVENANCE, validates Python 3.11 plus strict editable-`.[all,dev]` provenance, rejects repo-contained/live-Shay/retired/fallback environments, invokes pytest with `-p no:cacheprovider` and without the default integration/e2e exclusions for tests/e2e/test_shay_baseline_e2e.py plus any supplied arguments, then invokes tests/stress/test_concurrency.py, tests/stress/test_subprocess_e2e.py, and tests/stress/test_atypical_scenarios.py as standalone Python programs through their main() entry points. For this orchestration only, the two values are workspace_hygiene_contract.SHAY_TEST_PYTHON and workspace_hygiene_contract.SHAY_TEST_ENV_PROVENANCE, with immutable-v4 manifest checks performed by the external orchestrator. CI instead supplies separately attested absolute RUNNER_TEMP paths. The wrapper exits nonzero on provenance or command failure, never installs dependencies, and preserves existing default and focused pytest behavior outside explicit program invocation."
  ci_gate_rule: "The Phase 1 workflow edit preserves current triggers, adds push branches matching codex/shay-agent-* plus optional workflow_dispatch, creates a hermetic attested Python 3.11 `.[all,dev]` environment under RUNNER_TEMP, and calls the committed --e2e mode with its two absolute paths. Passing branch test/e2e checks are sufficient for phase CI completion. A PR is not required or authorized by this rule."
  proof_scope: "R1 evidence is phase-local only: wrapper behavior, complete baseline E2E/stress invocation, environment metadata, exact commands/exit codes/counts, live-profile non-write checks, archived-parent semantics, the minimal fresh-database idempotency race repair, and the rename-damage Node baseline repair. It records the current npm 404/cache reconstruction/typecheck failure as pre-repair evidence, then requires clean-registry npm ci, typecheck, and the focused externalCli test to pass after the repair. It MUST NOT emit lifecycle/safety/memory/protocol/CLI-upgrade PASS markers or docs/architecture/evidence/shay-agent-upgrade-evidence.json; those belong only to R8."
  idempotency_scope: "R1 may change create_task only enough to place the active-key lookup and fresh insert under one write transaction and make concurrent creators on a newly initialized database return one task ID/row. It may add a fresh-database supporting index only if no historical-row migration or destructive repair is required. It must not deduplicate existing rows, add a historical migration, change public service/API semantics, or claim restart durability; those are R3."
  idempotency_acceptance: "The unmodified intent of tests/stress/test_atypical_scenarios.py must pass with no skip/warning/relaxed assertion. A focused regression starts from a fresh isolated database, launches at least five concurrent creates with one active key, asserts one returned ID and one non-archived row, and asserts two distinct keys still create two tasks. R3 repeats these cases unchanged, adds a preexisting-duplicate fixture, proves deterministic non-destructive reconciliation and durable enforcement after migration, and proves matching service/API behavior across restart."
  expansion_rule: "If a required edit is outside allowed_paths, stop and submit the exact path, reason, owner, tests, and rollback impact before editing."

phase_3_idempotency_contract:
  preserve_from_r1: "Do not replace, weaken, skip, or create a second path around R1's fresh-database concurrent-active-key behavior. The same R1 regression and original atypical scenario must pass unchanged on the R3 branch."
  r3_ownership: "Detect every historical/preexisting active-key duplicate, choose a deterministic canonical row without silent deletion, preserve noncanonical rows for audit/reconciliation, apply an additive schema migration and durable uniqueness/enforcement strategy, expose one result through the Kanban service and /v1/runs compatibility adapter, and prove gateway/worker restart behavior."
  non_duplication_acceptance: "R3 must show that the fresh five-writer test still yields one ID/row; a legacy database containing duplicates migrates without record loss; repeated reconciliation is idempotent; old and new readers resolve the same canonical ID; and repeating the same service/API request before and after restart creates no additional task, run, or event transition. A worker killed mid-tool must recover as an explicit interrupted/uncertain or retry-required lifecycle state without a false completion or duplicated task/run/event transition. R3 does not claim that an external side effect executed exactly once."
  cancellation_acceptance: "R3 makes stop/cancel a durable terminal single-writer idempotent transition, proves status/events survive worker and gateway restart, never recovers cancelled as completed, and schedules no new dispatch from cancelled state. Because its branch lacks R4 effect interception, R3 does not claim that an already in-flight or nested tool effect cannot occur after cancel; R8 owns that composed claim."

