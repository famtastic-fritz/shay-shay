classification_contract:
  allowed_values:
    - "already exists"
    - "partial"
    - "absent"
    - "not runtime-proven"
  meaning:
    already_exists: "Source and an existing focused test identify a working owner; this does not imply cross-client or production proof."
    partial: "An authoritative owner and some behavior exist, but a roadmap invariant is missing or contradicted by current evidence."
    absent: "No current source owner implements the proposed behavior; a written ownership decision is required before code."
    not_runtime_proven: "Source or a test harness exists, but the required execution gate did not run successfully at this baseline."

scope:
  included:
    - "durable task, run, event, retry, cancellation, and restart truth"
    - "deterministic tool-effect, filesystem, approval, idempotency, retry, and spend controls"
    - "versioned memory provenance and owner-gated promotion"
    - "consistent domain semantics across CLI, TUI, gateway API, and ACP adapters"
    - "truthful CLI inspection, recovery, usage, and diagnostic output"
    - "anti-drift traceability and end-to-end proof"
  excluded:
    - "filming work"
    - "voice, STT, TTS, or spoken-persona work"
    - "identity or personality changes"
    - "credentials, account changes, payments, messages, publishing, production deployment, or native mobile-client work"
    - "wholesale adoption of another agent framework"

execution_dependency_contract:
  planning_anchor: "cf6bb95e3dc12e0d4b8eadef2c33be2b39ad21b6 is the Phase 0 source-audit anchor only; it is not the required implementation base for later packets."
  origin_main_refresh_rule: "Before each phase, fetch origin/main and verify that its current tip does not invalidate the pinned source facts, protected-custom manifest, path manifest, or dependency tip. Do not merge or rebase origin/main into a dependency branch under this approval."
  phase_base_rule: "Base each dependent phase only on a primary dependency's full external completion chain: all three current review records bind one candidate, exactly one implementation C has that tree, origin/<branch> equals C, the board task is done/read back at C, and external kanban_completed records equal commit/remote SHAs. Record C in dependency_refs.primary and implementation_base_sha. Integrate only dependency_refs.integrated commits proven by that same full chain into the isolated branch before authored edits, then record post-integration HEAD as integration_base_sha in the first phase-local event. A fresh origin/main observation is a drift check, not branch ancestry."
  dependency_chain:
    - "full R0 external completion chain -> R1 -> full R1 external completion chain -> R2"
    - "full R2 external completion chain -> R3"
    - "full R2 external completion chain -> R4"
    - "R5 bases on R4 C only after both R3 and R4 have three bound passes, one C, verified push C, board done/read-back, and external kanban_completed"
    - "R6 bases on R3 C only after both R3 and R4 have three bound passes, one C, verified push C, board done/read-back, and external kanban_completed"
    - "externally complete R6 C -> R7"
    - "R8 bases on externally complete R7 C and integrates externally complete R5 C; R3 is inherited through R6/R7 and R4 through R5"
  parallel_rule: "After R2's full external completion chain, R3 and R4 may run in parallel because their authored path sets are disjoint. After both R3 and R4 full chains reach kanban_completed, R5 may base on R4 C while R6 bases on R3 C, and R5 and R6 may run in parallel because their authored path sets are disjoint. Review-only, commit-only, or push-only shorthand never opens these gates. R4 and R5 are dependency-serialized and may not run in parallel."
  stacked_diff_rule: "Before editing, validate inherited changes through integration_base_sha against the union of all transitively reachable reviewed dependency manifests. During and after implementation, validate only integration_base_sha..HEAD as phase-authored work against the current phase manifest. Shared files are permitted only when the later phase inherits the reviewed earlier change before authoring its own delta."
  branch_isolation_rule: "Use one isolated worktree and feature branch per packet. Only reviewed feature-branch commits and pushes are authorized; merge to main remains blocked while approval_contract.merge_approval is null."
  ci_and_pr_authority_rule: "Passing GitHub Actions checks triggered by an authorized push to codex/shay-agent-* are the CI authority for phase completion together with the three external candidate-bound reviews and external completion chain. Creating a pull request is not required and is not authorized by a feature-branch push. PR creation, PR review mutation, merge, rebase into main, release, and live enablement require separate explicit owner authority; if no owner-authorized PR exists, unresolved-thread count and PR mergeability are not phase gates."

