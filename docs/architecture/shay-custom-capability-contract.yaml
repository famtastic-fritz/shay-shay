  program_board_relinked_payload_rule: "Construct each v3 relink row from that requirement's preceding archived-prefix or active row. Copy every field except replace contract_revision=non-synced-v3, setup_attempt_id=local-state-v3, the exact event ID/revision/prior/type/recorded_at/status from relocation_append_order, kanban_ref/evidence, and tests. kanban_ref uses the active v3 root/database, the newly read-back task ID, and exact idempotency key from program_board_contract.exact_idempotency_keys; status=linked, task_status=ready for R0 and todo for R1-R8. evidence is exactly one board/verified item pointing to initialization_summary_path with its actual SHA-256 and asserting the exact task ID/key/parent links were read back on local-state-v3. tests preserves order/text except every archived Documents executable is replaced with workspace_hygiene_contract.SHAY_TEST_PYTHON; the old executable is forbidden in any active row. All test/review/commit/release/finalization fields remain pre-review."
