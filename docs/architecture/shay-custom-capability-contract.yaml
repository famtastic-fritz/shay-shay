  first_write_rule: "After checkout, protected-hash verification, and dependency integration, the evidence JSONL is the phase's first authored file change. Its first line is event_type=implementation_started and records dependency_refs, implementation_base_sha, integration_base_sha, a clean changed_paths object, and honest not_run/not_reviewed/not_requested values before any other allowed path is written. R1-R7 start exactly at E0007 with prior_event_id E0006 and event_revision 7; R8 starts exactly at E0008 with prior_event_id SHAY-AGENT-R8:E0007 and event_revision 8 because its E0007 authority-freezing relink is occupied. Every later phase-local event advances contiguously."
  append_order: "Append, never replace: implementation_started; one or more implementation_evidence events; verification. The active v3 program_board_relinked event must already exist for every phase before its phase-local file or candidate is created; archived v1 links and invalid-v2 relinks are insufficient. A blocked pre-review fact may be appended and is never erased. Verification is the final in-repository phase-local event; reviews, implementation commit C, verified push, and Kanban completion append only to the active v3 external execution ledger."
  test_receipt_rule: "For R1-R8 the bound run-phase-tests verb materializes the exact tested tree in a clean external no-hardlink verification checkout and executes every exact command containing the contracted SHAY_PHASE_RUN_ROOT construction in a scrubbed environment. It emits canonical mode-0400 phase-test-receipts.jsonl rows with exact {schema_version,requirement_id,integration_base_sha,tested_tree_sha,command_index,contract_command,contract_command_sha256,argv,cwd,environment,network_policy,install_policy,started_at,ended_at,duration_ms,exit_code,stdout,stderr,validated_artifacts,interpreter,producer_sha256,effective_command,network_guard,environment_before_sha256,environment_after_sha256,source_tree_manifest_sha256,checkout_before_sha256,checkout_after_sha256,execution_checkout,execution_steps}; every execution_steps row is a closed {capture_kind,requirement_id,integration_base_sha,tested_tree_sha,producer_sha256,step_index,command,cwd,network_policy,argv,network_guard,exit_code,stdout,stderr} projection. capture_kind=tool_subprocess_capture_v1, producer_sha256 is the bound tool, the phase/base/tested-tree identities equal the parent receipt, argv is the exact sandbox-exec invocation, and stdout/stderr are base64 exact {encoding,size,sha256,data}. The manifest is exact {schema_version,requirement_id,integration_base_sha,tested_tree_sha,authority_tests_sha256,executable_command_count,receipts_sha256,source_changed_paths,source_inventory_sha256,ignored_records_sha256,ignored_manifest_sha256,live_manifest_sha256,submodule_sha256,producer_sha256,status,source_tree_manifest_sha256,checkout_before_sha256,checkout_after_sha256,execution_checkout}. Every command is confined by a macOS sandbox with default-deny file writes and explicit allows only for fresh output/temp and declared isolated Node dependency/build paths. Every local step is also OS network-denied except the single exact split npm ci --ignore-scripts --no-audit --no-fund dependency acquisition; all Node type-check/test/build steps are separately denied and Node audit remains unassessed. Candidate verification recomputes all identities and rejects missing rows, mutable-worktree execution, transient or symlink-escaped writes, altered argv/env/timing/streams/artifacts, nonzero exit, or status-only PASS. After receipts exist, only the tool may append the exact terminal phase-evidence row. In-Git evidence binds the tested source tree and a recomputed content digest over changed source paths excluding the phase-evidence file and R8 proof artifact; it never claims the final tree contains its own tree SHA. The candidate tree may differ from tested_tree_sha only by that strict issued phase-evidence extension and, for R8 alone, by the fresh receipt-generated proof, with the final selected tree recorded only in the external binding/ledger. Any other post-test source/configuration mutation fails."
  terminal_receipt_projection_rule: "The final phase-local verification row has test_results exactly {status:passed,manifest_sha256,receipts_sha256,tested_tree_sha,command_receipt_sha256} with the per-row receipt hashes in command order, and verification_refs exactly {status:passed,runner,runner_sha256,manifest_path:candidate-local:phase-test-manifest.json,receipts_path:candidate-local:phase-test-receipts.jsonl}. The runner path/hash is the bound review_phase0_candidate.py. These are pre-review test facts only."
  no_overwrite_rule: "Writers open the exact file in create-or-append mode, reject an existing final line without a newline, reject duplicate or skipped event revisions, fsync successful appends, and never sort, truncate, rewrite, or delete an earlier byte. Corrections use a new superseding event."
  commit_fact_rule: "Three separately orchestrator-dispatched reviewers emit immutable standalone results; local tooling enforces distinct identity strings/artifacts but cannot cryptographically prove cognitive or task independence. record-reviews preserves passed/failed/superseded history. The commit agent may stage only the pointer-selected candidate's exact reviewed paths after the latest non-superseded three passes; no git-add call-count claim is made. prepare-commit must run after staging and binds the exact ordered result rows, authorized board review delta, path/blob/mode set, tree/diff/index, parent, branch, frozen R0 message, raw object identity, deterministic commit-tree invocation, and compare-and-swap ref transition. The commit agent executes only those receipt-issued bytes/argv/environment. record-commit proves actual clean HEAD and real-index tree equal that still-active reviewed candidate, verifies the exact raw commit object and current review transition, and appends implementation_commit_recorded. The already-authorized feature-branch push is followed by record-push-ci, which independently runs git ls-remote and queries GitHub Actions using read-only provider access under the lock, embeds one exact content-addressed raw-query/normalized observation with a single timestamp directly in the canonical ledger event, and emits success or ci_verification_failed. Credentials/network absence blocks; caller-constructed, split-clock, or parallel receipts never pass. A failed-CI tip is immutable and only a new selected/reviewed successor may proceed. Review/commit/push/task facts are never backfilled into Git."
  canonical_ingest_rule: "Only R8 may append validated R1-R7 phase-local lines to docs/architecture/shay-agent-enhancement-trace.jsonl, and it does so before R8 candidate construction. It reads paths in requirement-number then event-revision order and copies only implementation_started/implementation_evidence/verification/blocked lines byte-for-byte, rejects divergent duplicate event_ids, gaps, broken prior_event_id links, invalid structured refs, or path-manifest violations, and never imports an R8 phase-local line or external execution-ledger line. R8's own pre-review chain remains at its exact phase-local path inside candidate C."
  reconciler_rule: "R2 reads the canonical ledger, exact path_map, external execution ledger, and board; it never scans directories or mutates any source. A missing local file is valid only while that requirement has no implementation_started event or claimed implementation evidence. It reconciles external review/commit/push/completion with the candidate and repository pre-review chain. Identical reruns produce byte-identical machine output and the same exit code."
  phase_diff_rule: "Before review, capture and later recompute the exact category-sensitive committed/staged/unstaged/untracked/ignored/submodule streams in complete-worktree-inventory-nul-v2. HEAD must equal integration_base_sha and the real index must be clean. Derive the candidate diff from integration_base_sha to candidate_tree_sha with rename detection, include both source and destination endpoints, and reject every path outside the exact phase_contract allowlist or matching its protected/forbidden set. The candidate authored manifest is recomputed directly from base/candidate Git blobs, including delete and rename sources. Every ancestry_required accepted C is proven by exact Git history/tree rules; every review_gate is separately proven complete/passing without falsely requiring ancestry. R5/R6 retain their single inherited lane and both completion gates; R8 cannot omit either R5 or R7. Ignored state must equal entry baseline."
  candidate_binding_rule: "For any phase, require HEAD==integration_base_sha and a clean real index, build one external disposable index, stage only the complete allowlisted path set, and bind the resulting tree/index/diff/authored blobs. Publish the authoritative stored index atomically at exact mode 0400, effective uid/gid and nlink 1, then apply and bind macOS UF_IMMUTABLE; its bytes, inode/device, size, mtime_ns, mode, and flags are invariant. No Git command ever receives that authoritative path: review and recorder paths byte-copy it to private mode-0600 files and use GIT_OPTIONAL_LOCKS=0. The Round 14 audit records the superseded-mode drift caused when an independent reviewer passed the authoritative path to git write-tree and Git atomically replaced it at mode 0644; that old index remains untouched and invalidated. Schema-v5 binding additionally freezes exact attempt/branch authority, dependency/review gates, integration proof, phase authority, executable test receipts, release policy, and R8 proof identity. R1-R8 use run-phase-tests followed by build-phase-select --receipt-id; the builder resolves only a tool-issued, unconsumed registry receipt for its exact tested tree. Under both locks it validates selection eligibility before mutation, writes the journal before a durable pending transaction path, and advances through pending publication, candidate publication, receipt consumption, predecessor invalidation, registry append, and atomic pointer replacement. resume-phase-select accepts only the exact journaled interruption, reconciles intended hashes with every already-applied state transition, and deterministically completes every crash window without receipt loss or duplicate consumption. Review never runs the R0-only documentation validator: it validates governing Git blobs, exact tool-issued phase-local chain/receipt refs, authored candidate blobs, immutable pre-stage inventory/submodules, protected identities, v4, temporal sentinels, and closure. Every lifecycle recorder later repeats the archived closure from immutable bytes and accepted C. Routine review does not rehash current ~/.shay."
  commit_binding_rule: "After three current passing reviews, the commit agent first stages only the complete reviewed path set and then invokes prepare-commit; invoking it against an unstaged, partial, extra, runtime, renamed, wrong-blob, wrong-mode, wrong-base, or wrong-branch state fails before authority is issued. Local evidence cannot prove how many git-add invocations produced that final state and makes no such claim. This is a separate transition, not a continuation or mutation of the candidate index: no process ever copies the stored candidate-index into the real index, and the stored artifact must retain its reviewed bytes/metadata. Staging intentionally changes category placement and real-index bytes, so post-stage worktree-inventory categories and real-index-file hashes MUST NOT equal the pre-stage review inventory or stored candidate-index hash. prepare-commit binds branch, parent HEAD, index inode/hash/tree/status, exact staged path/blob/mode rows, full binary/full-index/find-renames diff, newly derived authored manifest, protected invariants, exact three-result ledger suffix, and sole-recorder board comment/event transition. It captures the post-stage category-sensitive inventory and issues a content-addressed schema-v2 registry preparation before publishing the immutable receipt. Every receipt, prepared record, and registry publication walks/creates its authority parent descriptor-relatively with O_DIRECTORY and O_NOFOLLOW, then publishes, exchanges, and fsyncs by that verified directory descriptor; new-name directory moves use macOS renameatx_np(RENAME_EXCL), while replacement uses RENAME_SWAP and retains the validated displaced prior inode mode 0400 in its deterministic content-addressed history slot instead of unlinking it. Retry requires the exact installed/replacement and retained/prior tuple; concurrent divergence is atomically swapped back without destructive cleanup. Thus symlink-preplanted parents and targets appearing or changing at the rename syscall fail without redirect, clobber, deletion, or lost authority. The receipt's commit authorization is exact raw SHA-1 commit bytes with R0 message `docs: freeze Shay agent enhancement contract`, frozen author/committer/date/zone, `/usr/bin/git ... commit-tree <tree> -p <parent>` plus exact stdin/cwd/minimal environment, followed only by CAS `/usr/bin/git -c core.hooksPath=/dev/null update-ref refs/heads/<branch> <expected-C> <parent>`. The object step is idempotent and cannot move the branch; the hook-disabled CAS rejects a competing tip and a retry recognizes an already exact C. record-commit requires clean post-commit status, exact real-index tree, byte-identical authorization/review/board/ledger projections, raw commit object, one parent, message and identities. Any mismatch aborts; the tool never guesses or repairs."

