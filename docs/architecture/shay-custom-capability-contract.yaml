phase_1_path_manifest:
  manifest_id: "SHAY-PHASE-1-BASELINE-E2E-ALLOWLIST-v2"
  rule: "Only the following repository paths may be edited in Phase 1. Every other path is read-only until this manifest is amended by owner-reviewed evidence."
  allowed_paths:
    - ".github/workflows/tests.yml"
    - "scripts/run_tests.sh"
