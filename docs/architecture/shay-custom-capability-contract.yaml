finalization_protocol:
  pre_candidate_cutoff: "Before R8 candidate construction, freeze R1-R7 phase-local files through each final verification/blocked line and R8 through its verification line. Also acquire a shared lock and freeze the external execution-ledger prefix through the last complete R1-R7 kanban_completed event plus any valid R2 reconciliation; record path, line count, last event ID, last sequence, SHA-256, and hash-chain tip. No R8 review/commit/push/completion/finalization fact exists at this cutoff."
  validation: "Before repository writes, validate strict JSON/no duplicate keys, repository pre-review schemas/transitions/chains, external ledger schemas/hash chain/transitions, exact phase manifests, passing R1-R7 external reviews, commit C and identical verified remote SHA, board/task linkage and completion, protected hashes, and dependency-tip resolution. Copy R1-R7 phase-local pre-review lines byte-for-byte into canonical trace, keep R8's phase-local record as its allowed separate file, and build upgrade evidence/status from only the frozen external prefix. Any failure leaves canonical/status/final evidence bytes uncreated or byte-identical."
  repository_snapshot_rule: "The R8 candidate treats this Phase 0 capability contract and plan as frozen reviewed authority and may not edit either one. It contains the canonical pre-review trace, byte-for-byte R1-R7 phase evidence ingestion, common proof artifact, diagrams, final checklist, and status page under the exact R8 E0007 manifest. Its evidence/status files state that R8 final reviews, commit, provider-verified push/CI, Kanban completion, and program finalization remain external. record-finalize first replays immutable candidate-wide retry-budget/exhaustion state under the ledger lock before any provider call, selection closure, successor ancestry check, remote discovery, or issuance. It recomputes the clean accepted R8 C/tree/index, status and trace, exact pre-review to post-completion board/ledger relationship, and active-successor lifecycle. Successor ancestry is derived from the exact ledger-bound failed-CI provider observation and local Git DAG commit/tree/parent facts; it performs no separate predecessor ls-remote. Only after those local checks may the recorder append generation 1 program_finalization_query_issued, whose schema-v4 transaction binds the accepted candidate/tree/binding/tool, fresh nonce/time after completion, exact pre-final ledger prefix/count/tip/time, nine exact query targets/generation-unique IDs, a 30-second absolute monotonic deadline per provider request, byte caps, and a sixteen-attempt per-generation ceiling. Every network/provider helper must match that issued query plan. Immediately before each provider primitive, the ledger durably records a started reservation for the exact query plus canonical argv/cwd/scrubbed environment/no-shell or HTTPS request and its maximum byte charge. Its matching result records actual bytes or interruption; unmatched reservations remain fully charged and are closed before retry, and a completed result without an attempt closure is never replayed. No out-of-plan or unreserved provider call exists. Failed attempts retain only exact failed-query bytes under one joint 64 KiB cap; successful prefixes are re-run, not duplicated. Candidate-wide automatic authority is at most three generations, 48 started attempts, and 64 MiB of all actual or conservatively reserved provider bytes. Every successful git/HTTP result preserves exact wire bytes, and replay independently recomputes observed versus retained totals. At that boundary a typed program_finalization_retry_budget_exhausted row binds and closes the active issuance/current attempt or last generation exhaustion, blocks_needs_owner_action, and permits no provider call on any retry. No automatic retry authorization exists. A later program_finalized only from an active in-budget generation embeds all nine capped raw responses, exact content hashes and normalized facts. program_finalization_abandoned remains reserved for irrecoverable issued-plan or semantic-integrity failure. Replay recomputes every generation/supersession/raw/normalized/query/time/branch/SHA/status/reservation/result/attempt/byte relationship. There is no external finalizer evidence store. A crash before issuance leaves nothing; after issuance/reservation/result/exhaustion recovery reuses exact ledger authority; after terminal append retry is byte-idempotent and performs no provider call. At most one pending generation, one permanent budget-exhaustion closure, and one terminal closure exist per candidate."
  status_page_rule: "docs/status/shay-agent-enhancement-status.md must identify evidence class locally proven or launch-blocked, record external ledger path/cutoff sequence/last event/prefix SHA-256 plus board snapshot SHA-256, list R0-R7 C/remote/task facts visible at that cutoff, state R8 terminal facts pending exactly as repository_snapshot_rule requires, and list merge/live approval as absent. It must not say finalized, merged, released, enabled, production-proven, or complete."
  terminal_sequence: "Freeze and review the R8 candidate; create C and record-commit; push and record-push-ci; complete the exact Kanban task; then invoke record-finalize with a token. The verb's first locked decision replays the immutable candidate-wide budget/exhaustion state before any provider call. With no active generation or terminal row, it appends only an in-budget generation. Immediately before each exact issued Popen or urlopen it appends program_finalization_query_started with the call identity and conservative maximum-byte reservation; after the call it appends the matching program_finalization_query_result. The first started row increments one outer retry attempt. Within that attempt provider_call_sequence resets to one and must be a prefix of the exact 49-call order: R0 remote equality, then remote/workflow/runs/run/jobs/artifacts for each R1-R8; a 50th, repeated, skipped, or reordered call fails before I/O. Completed results reconcile to actual bytes, while an unmatched reservation is closed as interrupted at its full charge and a result lacking an attempt closure is deterministically failed before any new I/O. Only then may a transient attempt append program_finalization_query_attempt_failed. Success atomically appends program_finalized with full wire-byte/normalized evidence. Failed-CI predecessor proof uses the ledger-bound failed-CI provider observation plus local Git DAG only. The sixteenth failed attempt appends program_finalization_retry_exhausted unless the attempt/reserved-or-observed-byte global boundary directly requires program_finalization_retry_budget_exhausted. The first three generations share one finite 48-outer-attempt/64-MiB observed-or-reserved candidate budget. At the exact boundary the finalizer appends program_finalization_retry_budget_exhausted, closes the active issuance if present, and returns blocked_needs_owner_action without another query. No automatic reset or retry authorization exists. A pending issuance is resumed with its identical nonce and plan. An existing terminal or budget-exhausted row is detected before any new issuance or provider work; both no-op paths perform zero provider calls and leave ledger bytes unchanged. No repository byte or branch tip moves after accepted C."
  repeat_rule: "A valid program_finalized makes a rerun state-idempotent: it is detected and fully replay-validated before issuance, and the already ledger-bound epoch/generation/reservations/results/attempt/raw/normalized evidence and final snapshot are reused without a provider call. The existing event returns without another issue or durable residue. Retryable failures remain pending below sixteen; generation exhaustion permits a contiguous successor only while its current finite epoch has budget. Candidate-wide automatic counters never reset. Budget exhaustion is a blocked needs-owner-action state, not success or abandonment, and record-finalize makes zero provider calls thereafter; only a future separately reviewed code/contract revision outside this automation can change that finite authority. Missing, duplicated, replayed, oversized, or tampered budget/generation/supersession/issue/reservation/result/attempt/raw/normalized/query/timing evidence; extra board/ledger delta; or any post-terminal event fails. The finalization snapshot schema_version=6 binds the active issued pre-terminal ledger tip separately from the immutable R8 pre-review snapshot."
  failed_ci_recovery_rule: "A reviewed local commit first receives implementation_commit_recorded, but it becomes the accepted dependency C only after provider-backed feature_branch_push_verified. If its mandatory branch CI fails, record ci_verification_failed with the durable authoritative receipt and an explicit blocked attempt state while deliberately leaving the Kanban requirement active ready/running rather than falsely blocked. start-successor validates that ledger-bound failed-CI provider observation plus the exact local Git DAG commit/tree/base facts and authorizes only a fresh candidate with a new attempt ID and distinct successor feature branch. candidate_superseded binds the failed-CI event and invalidates all old reviews/commit for acceptance. Every successor commit/push/no-op/completion/finalization repeats the ledger-plus-local proof without an undeclared remote query; branch reuse or inclusion of the failed tip in the accepted successor DAG fails. All three candidate reviews rerun; only a successor with authoritative remote equality and CI success may complete."

r8_canonical_proof_contract:
  artifact_path: "docs/architecture/evidence/shay-agent-upgrade-evidence.json"
  verification_worktree_rule: "Before R8 candidate construction, run scripts/run_shay_upgrade_proof.sh from a separate clean verification worktree at R8 integration_base_sha plus the candidate's already-authored allowed changes represented by the temporary candidate tree. Before and after proof, require an exact clean-state/inventory binding except for those candidate bytes. The runner accepts an explicit output path outside every Git checkout, creates JSON in a fresh external temporary directory, and never writes the repository artifact path."
  finalization_copy_rule: "After proof passes but before candidate freeze, copy the external artifact byte-for-byte to docs/architecture/evidence/shay-agent-upgrade-evidence.json in the R8 worktree; verify equality, SHA-256, and closed schema. It is an ordinary reviewed R8 candidate byte included in the single implementation commit C; no second Git commit follows."
  pass_markers:
    - "PASS: baseline"
    - "PASS: lifecycle"
    - "PASS: safety"
    - "PASS: memory"
    - "PASS: protocol"
    - "PASS: CLI journey"
  ownership: "Only R8 may emit these six markers or create the canonical artifact at docs/architecture/evidence/shay-agent-upgrade-evidence.json. R3 and R7, like every earlier phase, run and record only phase-local tests/evidence; they do not run the common proof runner, write the canonical artifact, or claim a future capability."
  evidence_json_schema: "Exact object {schema_version,generated_at,program_id,implementation_base_sha,integration_base_sha,dirty,environment,commands,capability_assertions,test_totals,artifacts,protected_hashes,feature_flags,rollback_results,external_execution_snapshot,derived_markers,skipped_required,blocked_required,semantic_observations}. schema_version=1; generated_at is RFC3339; program_id and SHAs match the candidate; dirty=false. commands is exactly the two contracted top-level command receipts, each exact {command,exit_code,status,stdout_sha256,stderr_sha256}, every status=passed/exit=0/hash valid, and the proof command contains explicit external SHAY_UPGRADE_PROOF_OUTPUT plus scripts/run_shay_upgrade_proof.sh. Internal split execution steps, including behavioral rollback, remain bound through the receipt packet and semantic observations but are not promoted into commands. capability_assertions is exact {baseline,lifecycle,safety,memory,protocol,cli_journey}, all true and tool-derived. test_totals is exact {executed_commands:2,passed_commands:2,failed_commands:0,skipped_commands:0,validated_semantic_evidence:6}. semantic_observations is the exact ordered six-row closed kind-specific projection defined by r8_proof_issuance_rule; each row binds its exact evidence hash and every source relation is recomputed. The CLI row binds its durable issued E2E receipt and exact tested blob/command/stdout/exit values; a digest of discarded runner bytes is forbidden. artifacts and protected_hashes are sorted unique exact {path,sha256} and every hash is recomputed from the candidate Git blob. Feature flags and passing rollback_results use their closed schemas; the internal rollback receipt must first prove bundled_operator_plugin enabled/active, execute the exact flag-off command, then prove disabled and the legacy path restored. derived_markers equals the exact six pass markers but is emitted only by the tool after all independent observations validate; caller or script marker/assertion strings have no authority. external_execution_snapshot exactly equals the candidate-bound immutable pre-review ledger line count/event/prefix hash and board snapshot hash, with state=r1_r7_complete_r8_pre_review; cutoff 1 is invalid. skipped_required and blocked_required are empty. Additional keys fail."
  failure_rule: "A missing dependency, absent marker, false assertion, nonzero command, missing/invalid hash, dirty tree, required skip, blocked proof, protected mismatch, or rollback failure exits nonzero and cannot be represented as a pass."

