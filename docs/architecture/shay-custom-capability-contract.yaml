  portable_e2e_provenance_rule: "SHAY_TEST_ENV_PROVENANCE is a caller-supplied absolute regular-file path outside the repository and live Shay home. Its strict canonical JSON plus newline records schema_version, repository, reviewed_sha, pyproject_sha256, dependency_lock_hashes, python_executable, python_version, install_command, pip_check_exit_code, and environment_kind; additional keys and duplicate keys fail. reviewed_sha is a resolvable Git commit whose pyproject and recorded lock hashes equal the current checkout inputs; python_executable resolves exactly to SHAY_TEST_PYTHON; python_version begins 3.11.; install_command is exactly `python -m pip install -e '.[all,dev]'`; pip_check_exit_code is 0; environment_kind is immutable_local or ephemeral_ci. The local v4 schema-2 provenance named above is an accepted orchestration compatibility record because it binds the same required repository, reviewed SHA, pyproject hash, interpreter, Python 3.11 version, install command, pip-check result, and freeze hash; the wrapper does not hardcode its location."
