phase_5_memory_benchmark_contract:
  fixture_path: "tests/fixtures/memory_provenance_benchmark_v1.json"
  fixture_schema: "Closed JSON object {schema_version,seed,corpus,queries}. schema_version=1; seed=20260913; corpus has exactly 32 objects with IDs memory-001 through memory-032 and exact keys {id,target,content,source,created_at,confidence,supersedes_or_tombstones}; queries has exactly 16 objects with IDs query-001 through query-016 and exact keys {id,text,expected_record_ids,forbidden_record_ids,required_provenance_fields}. IDs and reference arrays are sorted and duplicate-free, timestamps are fixed RFC3339, targets are memory/user, and reviewed literal fixture bytes plus SHA-256 are the corpus authority."
  offline_protocol: "Compare the externally reviewed pre-R5 dependency tip R4 C with the R5 candidate tree in two clean worktrees using the identical immutable-v4 caller-supplied Python 3.11 all+dev interpreter/provenance bytes, fixture bytes, hardware fingerprint, and seed. For each side and round, scrub HOME, SHAY_HOME, SHAY_PROMPT_MEMORY_VAULT and all Kanban overrides before imports; pin three distinct descendants of a fresh external profile root; write all 32 records through public built-in MemoryStore APIs; close/reopen; run all 16 queries through the reviewed offline recall entry point; and record cited IDs plus canonical serialized provenance. Network, LLMs, external providers, owner paths, shared mutable cache/state, and live data are forbidden."
  schedule: "Run one unmeasured warmup per side followed by five measured paired rounds. Odd rounds are baseline then candidate; even rounds are candidate then baseline. Recreate both profile roots each round and use time.perf_counter_ns around only each query call."
  metrics: "For N=16 query values, per-round p95 uses nearest-rank zero-based index ceil(0.95*N)-1 after sorting, and each side's reported value is the median of its five round p95 values. provenance_precision=expected cited IDs/all cited IDs, with empty citations scoring 0. required_field_omission=missing required provenance fields/all required fields. stale_fact_rate=forbidden cited IDs/all cited IDs, with empty citations scoring 0. token_p95 applies ceil(len(canonical UTF-8 retrieval payload bytes)/4) per query before the same p95/median aggregation. Raw query rows, round values, medians, order, seed, fixture/interpreter/provenance/commit hashes, and hardware fingerprint are retained."
  acceptance: "The existing implementation directive approves these technical thresholds: candidate provenance_precision=1.0, required_field_omission=0, stale_fact_rate=0, median token_p95 <= baseline*1.10+32, and median latency_p95 <= max(baseline*1.25, baseline+5ms). Any threshold/protocol/environment/hardware/fixture mismatch, owner-path or network access, cross-profile spillover, or prompt-cache regression rejects R5. No later owner improvisation changes these values; merge approval remains null."

phase_5_promotion_contract:
  supported_scope: "R5 supports only ordinary candidate-to-curated memory promotion through MemoryStore.promote_candidate(record_id, decision_id) with a same-profile exact-record single-use owner-review decision. Identity/persona and high-impact standing-rule promotion is intentionally unavailable and fails closed."
  anti_auto_promotion: "Writes, recall, restart, confidence, repetition, model output, and external-provider mirrors never promote. Missing, reused, stale, cross-profile, or record/hash-mismatched owner decisions cause no mutation. One valid decision produces one curated superseding record and remains auditable; it never rewrites raw evidence."
  acceptance: "Tests retain an ordinary record in candidate state across repeated write/recall/restart, promote it exactly once only with a matching owner decision, reject every invalid/replayed decision, reject protected identity/persona targets even through the public operation, and prove PERSONA.md, SOUL.md, docker/SOUL.md, and owner files byte-identical."

phase_4_effect_idempotency_contract:
  ownership: "R4 alone owns durable tool_call_id/effect_id keys and exactly-once behavior for the synthetic external-effect counter across retry, reconnect, and restart. R3 lifecycle identifiers and transitions may be inputs, but R3 proof is not external-effect proof."
  nested_effect_rule: "execute_code and every environment/composite backend is a parent effect. Before dispatch, R4 must enumerate and persist a stable ordered child tool_call_id/effect_id plus request digest and parent ID for every nested effect; each child receives ordinary policy and deduplication. If enumeration is unavailable before the first effect, deny the parent with zero child effects. Retry reuses, never remints, child identities."
  unknown_cost_rule: "For a cost-bearing effect, absence of an authoritative provider maximum or a maximum encoded in the request and authoritatively enforced by the provider at or below the remaining USD ceiling denies before dispatch as cost_unknown. If authoritative actual usage is missing after an admitted call, record unknown and block every later cost-bearing call in that task/run until reconciliation. Unknown is never treated as zero or an estimate. Read/local classes proceed only when declared non-spend."

phase_6_public_operator_contract:
  owner: "shay_cli/domain_contract.py"
  operations:
    - "inspect_task(task_id)"
    - "list_task_events(task_id, after_event_id)"
    - "cancel_task(task_id, actor)"
    - "retry_task(task_id, actor)"
    - "resume_task(task_id, actor)"
  state_rule: "All five operations delegate to R3 Kanban task/run/event truth. Adapters add transport mapping only; no client-local lifecycle store or second command registry is permitted. R7 must consume this seam rather than direct Kanban access."
  optional_fields: "Versioned effect and memory_provenance projections are optional. Absence serializes as unavailable, never zero/empty/safe. Presence requires a valid schema version and authority reference; unknown/additive fields remain compatible under the declared version rule."

cross_phase_compatibility_contract:
  r3_r4: "After both phase-local awaiting_pair packets exist and before either candidate freeze, the R3 coordinator invokes run-pair-tests for SHAY-PAIR-R3-R4. The tool materializes R3's tested tree, applies R4's complete delta from their common reviewed R2 C/base tree, rejects conflicts, and runs phase_test_execution_contract.pair_compatibility_receipt_rule's exact approval/cancel/restart argv. The dedicated pair registry records the R2 C and base-tree SHA, both input tree SHAs, deterministic composed-tree SHA, exact execution envelope, output, and artifact hashes. Both R3 and R4 receive their only passing terminal evidence from that completed transaction and bind identical receipt bytes. The gate proves approval-wait restart and durable deny/cancel/no-new-scheduling compatibility; only R8 claims no post-cancel nested/in-flight effect."
  r5_r6: "After both phase-local awaiting_pair packets exist and before either candidate freeze, the R5 coordinator invokes run-pair-tests for SHAY-PAIR-R5-R6. The tool starts from the accepted R3/R4 composition, applies R6's delta relative to R3 and then R5's delta relative to R4, rejects conflicts, and runs phase_test_execution_contract.pair_compatibility_receipt_rule's exact optional-field argv. The dedicated pair registry binds the accepted R3 C/R4 C and predecessor-pair authority, R5/R6 input trees, deterministic composed-tree SHA, exact execution envelope, output, and artifact hashes. Both R5 and R6 receive their only passing terminal evidence from that completed transaction and bind identical receipt bytes."
  invalidation: "Changing any input/base/tested/composed tree, command, result, or artifact invalidates the receipt and both paired candidate freezes. R8 must consume and revalidate both already-passing relationships before integration; it may not create a first-time compatibility waiver."
  concurrency: "R3/R4 and R5/R6 implementation work may run in parallel with maximum phase concurrency two, but each pair meets at this barrier before review/freeze."

